    zoom: true

  # source: https://stacks.stanford.edu/image/iiif/cg079yw6169%2FAM_0070
  # canvas: https://purl.stanford.edu/cg079yw6169/iiif/canvas/cocina-fileSet-cg079yw6169-19f58952-e039-479d-aaaf-7fa2c240c247
  - id: "cat-19"
    src: figures/cat-19.jpg
    alt: "Engraved chart of the northwest African coast, shown on an open page. The coastline runs diagonally from the Strait of Gibraltar at top right to Cape Verde at bottom left, with Madeira and the Canary Islands offshore and two compass roses in the Atlantic."
    zoom: true

  # cat. 20: manifest has 2 canvases; this is page 1 (confirmed).
  # source: https://stacks.stanford.edu/image/iiif/cv760nn3650%2Fcv760nn3650_0001
  # canvas: https://purl.stanford.edu/cv760nn3650/iiif/canvas/cocina-fileSet-cv760nn3650-cv760nn3650_1
  - id: "cat-20"
