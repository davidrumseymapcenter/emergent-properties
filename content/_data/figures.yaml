  - id: "cat-26"
    src: figures/cat-26.jpg
    alt: "Long horizontal chart of American political parties from 1789 to 1880, drawn as colored streams that split, merge and twist across the page: Federalist, Democratic-Republican, Whig, Democratic and Republican. Presidents’ names run along the top, notes on issues fill the spaces, and election results form a band along the bottom."
    zoom: true

  # cat. 27: image added locally; source not recorded.
  - id: "cat-27"
    src: figures/cat-27.jpg
    alt: "Illustrated chart on a book page. A row of tomato paste cans grows larger from 1898 to 1928 to show rising exports, and below it racks of hanging hams and sausages grow longer to show exports of cured meats from 1876 to 1928, with figures printed in red."
    zoom: true

  # cat. 28: image added locally; source not recorded.
  - id: "cat-28"
    src: figures/cat-28.jpg
    alt: "Open book with two maps of Moscow. The left shows bus routes in red radiating from the center, the right shows trolleybus routes in blue. Below each, rows of small bus or trolleybus icons show the size of the fleet in each year."
    zoom: true

  # cat. 29: in copyright; low-resolution image added locally, not zoomable.
  - id: "cat-29"
    src: figures/cat-29.jpg
    alt: "Fold-out poster photographed in its frame. The left panel is a tall map of California crossed by seventeen east-to-west elevation profiles decorated with small symbols for trees, fields and buildings. The right panel has the title, an introduction and three pictorial charts of crops, sources of electricity and population growth."
    zoom: false
    caption: "This object is still under copyright, so a thumbnail image is being used."

  # cat. 30: image added locally; source not recorded.
  - id: "cat-30"
    src: figures/cat-30.jpg
    alt: "Two-part sheet mounted on linen. The top is a chart of the world’s highest mountains, drawn as tall, colored spires grouped by region and labeled with names and heights. The bottom is a world map with the major mountain ranges picked out in color."
    zoom: true

  # cat. 31: in copyright; low-resolution image added locally, not zoomable.
