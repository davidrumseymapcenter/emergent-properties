# ------------------------------------------------------------------------------
# Figures
# ------------------------------------------------------------------------------
#
# Image, video, audio, and table resources referenced by id from page frontmatter
# (`figure:`), object records in objects.yaml (`figure:`), and the `{% figure %}`,
# `{% figuregroup %}`, and `{% ref %}` shortcodes.
#
# Each id must be unique and may only be rendered once in the publication; see
# content/_data/README.md.
#
# Source files live in content/_assets/images/figures/ and `src` is written
# relative to content/_assets/images/. With `zoom: true` Quire builds its own
# IIIF tile pyramid and derivatives into _site/iiif/<figure-id>/ at build time,
# so these are self-hosted rather than streamed from the Stanford repository.
#
# Each image was downloaded from the SDR IIIF service recorded in the `source`
# comment, at `full/!4000,4000/0/default.jpg` (longest edge 4000px). Re-download
# from that URL to refresh or to fetch a different size.
#
# `alt` text was written from the images themselves on 2026-11-16 and should be
# checked by someone who knows the objects.

figure_list:
  # source: https://stacks.stanford.edu/image/iiif/mv556fd9168%2Fmv556fd9168_00_0001
  # canvas: https://purl.stanford.edu/mv556fd9168/iiif/canvas/cocina-fileSet-mv556fd9168-mv556fd9168_1
  - id: "cat-1"
    src: figures/cat-1.jpg
    alt: "Hand-colored woodcut map of Italy in the Ptolemaic style, with the peninsula stretched from west to east. Tan land is crowded with rivers and place names, set against blue seas; Corsica, Sardinia and the tip of Sicily sit along the bottom edge."
    zoom: true

  # fixed
  # cat. 2: manifest has 146 canvases; this is page 11, "Typus Orbis Terrarum".
  # source: https://stacks.stanford.edu/image/iiif/hg446zm6747%2F10000011
  # canvas: https://purl.stanford.edu/np593hr6132/iiif/canvas/cocina-fileSet-hg446zm6747-hg446zm6747_1
  - id: "cat-2"
    src: figures/cat-2.jpg
    alt: "Engraved black-and-white world map in an oval, shown as an open atlas spread. The continents are recognizable but distorted, and a vast imagined southern continent runs along the bottom. Clouds fill the corners, with the title in a banner above and a Latin quotation below."
    zoom: true

  # cat. 3: manifest has 754 canvases; this is page 90, "Vol I (43) Venetia (Venice)".
  # source: https://stacks.stanford.edu/image/iiif/wk475qx4162%2F12126090
  # canvas: https://purl.stanford.edu/db076zm5895/iiif/canvas/cocina-fileSet-wk475qx4162-wk475qx4162_1
  - id: "cat-3"
    src: figures/cat-3.jpg
    alt: "Engraved bird’s-eye view of Venice across an open atlas spread. The dense city curves around the Grand Canal, with Giudecca and San Giorgio in front and ships and gondolas in the lagoon. A numbered key and a scene of robed Venetian dignitaries run along the bottom."
    zoom: true

  # cat. 4: 11621 × 4282 px. Image added locally; source not recorded.
  - id: "cat-4"
    src: figures/cat-4.jpg
    alt: "Twelve tapering, pointed globe gores and two circular polar caps laid out in a row on a gray background. They are engraved with constellation figures: mythological people, animals, sea serpents and ships among the stars."
    zoom: true

  # cat. 5: 14990 × 661 px. Image added locally; source not recorded.
  # `region` (x,y,width,height in image pixels) opens the viewer zoomed in on Taiwan.
  - id: "cat-5"
    src: figures/cat-5.jpg
    alt: "A very long, narrow hand-painted scroll map of the Chinese coast. Land runs along the top in a continuous strip of hills, harbors, walled towns and red flags marking forts, labeled in Chinese characters, with a pale green sea and islands below."
    zoom: true
    region: "8295,0,1680,661"

  # cat. 39: image added locally; source not recorded.
  - id: "cat-39"
    src: figures/cat-39.jpg
    alt: "Engraved sample landscape demonstrating standard mapping symbols, on an open atlas page. It includes shaded hills, a winding river with a bridge, a town, fields, marshes, woods, a formal garden and a star-shaped fortress."
    zoom: true

  # cat. 6: manifest has 15 canvases; this is page 4, "Carta Etnografica. II.".
  # source: https://stacks.stanford.edu/image/iiif/zb031tf7933%2F2693002
  # canvas: https://purl.stanford.edu/qf485cq3676/iiif/canvas/cocina-fileSet-zb031tf7933-zb031tf7933_1
  - id: "cat-6"
    src: figures/cat-6.jpg
    alt: "Color map of Mexico with regions tinted in pale pastels and bar charts of population set into the oceans. The map is framed by about thirty small color scenes of people from different regions in traditional dress, at work, at market, and dancing."
    zoom: true

  # cat. 7: in copyright; low-resolution image added locally, not zoomable.
  - id: "cat-7"
    src: figures/cat-7.jpg
    alt: "Bright pictorial map of the United States with yellow land and blue and green seas, photographed in its frame. Small cartoon figures and captions are spread across the country, a row of portraits runs along the top, and a small inset map and a decorative title wreath sit in the lower corners."
    zoom: false
    caption: "This object is still under copyright, so a thumbnail image is being used."

  # source: https://stacks.stanford.edu/image/iiif/sy409bk9698%2Fsy409bk9698_05_0001
  # canvas: https://purl.stanford.edu/sy409bk9698/iiif/canvas/cocina-fileSet-sy409bk9698-sy409bk9698_1
  - id: "cat-8"
    src: figures/cat-8.jpg
    alt: "Engraved map of North America showing California as a long island off the west coast. A scrolled title cartouche fills the upper left, the Atlantic coast and Caribbean islands are at right, and the sheet is mounted on a larger board."
    zoom: true

  # source: https://stacks.stanford.edu/image/iiif/dv843cp9178%2F3458000
  # canvas: https://purl.stanford.edu/dv843cp9178/iiif/canvas/cocina-fileSet-dv843cp9178-dv843cp9178_1
  - id: "cat-9"
    src: figures/cat-9.jpg
    alt: "Black-and-white lithographed map of northern California’s Central Valley. The Sierra Nevada is drawn as a dense mass of shaded hills along the right, the Coast Ranges along the left, and the Sacramento and San Joaquin Rivers wind between them toward San Francisco Bay at lower left."
    zoom: true

  # cat. 10: image added locally; source not recorded.
  - id: "cat-10"
    src: figures/cat-10.jpg
    alt: "Hand-colored map of western North America from the Pacific to the Mississippi, with large territories washed in tan, pink and brown, including Oregon, Upper California and Texas. Two small insets in the lower left show sea and overland routes to California and the gold district."
    zoom: true

  # cat. 11: image added locally; source not recorded.
  - id: "cat-11"
    src: figures/cat-11.jpg
    alt: "Russian engraved nautical chart of the Pacific coast, a narrow strip of coastline running down the page with depth soundings offshore. An inset of a bay sits at upper right above three small drawings of the coast seen from the sea, with an ornate title at lower right and handwritten pencil notes in the margins."
    zoom: true

  # source: https://stacks.stanford.edu/image/iiif/vz743gy9625%2Fvz743gy9625_0001
  # canvas: https://purl.stanford.edu/vz743gy9625/iiif/canvas/cocina-fileSet-vz743gy9625-vz743gy9625_1
  - id: "cat-12"
    src: figures/cat-12.jpg
    alt: "Hand-drawn survey plat in brown ink on pale linen. A narrow, irregular land parcel is outlined between a winding river and a straight road, crossed by survey grid lines, with a handwritten table of boundary measurements at lower left and certification text at lower right."
    zoom: true

  # source: https://stacks.stanford.edu/image/iiif/qw436vd3442%2F3451000
  # canvas: https://purl.stanford.edu/qw436vd3442/iiif/canvas/cocina-fileSet-qw436vd3442-qw436vd3442_1
  - id: "cat-13"
    src: figures/cat-13.jpg
    alt: "Large, faded manuscript map of the Los Angeles basin on yellowed paper. Finely shaded mountain ridges run across the top and down the right side, while the flat basin below is covered in a faint grid of roads, ranch lines and towns, with the coastline curving along the lower left."
    zoom: true

  # cat. 14: image added locally; source not recorded.
  - id: "cat-14"
    src: figures/cat-14.jpg
    alt: "Hand-colored street map of San Francisco’s Chinatown, from Powell to Montgomery Streets and Bush Street to Broadway. Each building lot is outlined, tinted in yellow, pink, red, blue or green, and labeled in Chinese. Two insets at left show the whole city and the Bay Area."
    zoom: true

  # cat. 15: image added locally; source not recorded.
  - id: "cat-15"
    src: figures/cat-15.jpg
    alt: "Map of the continental United States in which each state is raised as a block whose height shows its 1940 Japanese American population. California towers far above the others as a tall yellow-sided column, followed by Washington and Oregon, with the teal states set on a peach background."
    zoom: true

  # source: https://stacks.stanford.edu/image/iiif/wn353bn6740%2Fwn353bn6740_0001
  # canvas: https://purl.stanford.edu/wn353bn6740/iiif/canvas/cocina-fileSet-wn353bn6740-wn353bn6740_1
  - id: "cat-16"
    src: figures/cat-16.jpg
    alt: "Mimeographed map of the Tule Lake camp, showing a grid of numbered residential blocks and sketched buildings such as the hospital, administration, factory and gymnasium. Cartoon figures play baseball, ride a tricycle and hang laundry, and handwritten notes in blue ink include “I live here.” The paper is stained and creased."
    zoom: true

  # cat. 17: in copyright; low-resolution image added locally, not zoomable.
  - id: "cat-17"
    src: figures/cat-17.jpg
    alt: "Poster of California drawn as a brown, tilted three-dimensional block, its mountains, valleys and coastline rendered in dense black line work. The title “California” arches across the top in letters fading from yellow to pink, within ornate scrollwork on a cream background."
    zoom: false
    caption: "This object is still under copyright, so a thumbnail image is being used."

