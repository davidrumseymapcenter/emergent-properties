# ------------------------------------------------------------------------------
# Figures
# ------------------------------------------------------------------------------
#
# Image, video, audio, and table resources referenced by id from page frontmatter
# (`figure:`), object records in objects.yaml (`figure:`), and the `{% figure %}`,
# `{% figuregroup %}`, and `{% ref %}` shortcodes.
#
# Each id must be unique and may only be rendered once in the publication; see
# content/_data/README.md.
#
# Source files live in content/_assets/images/figures/ and `src` is written
# relative to content/_assets/images/. With `zoom: true` Quire builds its own
# IIIF tile pyramid and derivatives into _site/iiif/<figure-id>/ at build time,
# so these are self-hosted rather than streamed from the Stanford repository.
#
# Each image was downloaded from the SDR IIIF service recorded in the `source`
# comment, at `full/!4000,4000/0/default.jpg` (longest edge 4000px). Re-download
# from that URL to refresh or to fetch a different size.
#
# Still to do: `alt` text for every figure.

