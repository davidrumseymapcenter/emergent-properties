    src: figures/cat-22.jpg
    alt: "Colorful pictorial map of South Africa around the time of the Boer War, with green land, brown hills and red railway lines linking towns. Painted views of cities are set into the landscape, Queen Victoria’s portrait is at top center, British generals fill the upper corners, and soldiers stand in the lower corners. Part of the right edge is damaged."
