  - id: "cat-23"
    src: figures/cat-23.jpg
    alt: "Framed map of the West African coast, photographed on display. The land is divided into many small regions colored in pale yellow, purple, green and orange, crossed by blue-green rivers, with a stippled pale green sea above and a circular title at lower left inside a patterned border."
    zoom: false
    caption: "This object is still under copyright, so a thumbnail image is being used."

  # cat. 24: image added locally; source not recorded.
  - id: "cat-24"
    src: figures/cat-24.jpg
    alt: "Hand-colored line chart of England’s trade with North America from 1700 to 1800. A pink exports line and a yellow imports line rise across the century, with the gap between them shaded green and labeled “Balance in favour of England.” Exports plunge sharply in the late 1770s before climbing again."
    zoom: true

  # cat. 25: image added locally; source not recorded.
  - id: "cat-25"
    src: figures/cat-25.jpg
    alt: "Lithograph of London seen from above at night, with the moon and stars over a city of lit streets and the winding Thames. A line across the sky traces the balloon’s height in feet over time, and the landmarks it passed are labeled along the bottom."
    zoom: true

