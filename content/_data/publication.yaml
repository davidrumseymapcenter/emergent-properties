# Title & Description
title: Emergent Properties
subtitle: Decennial Reflections on Collections of the David Rumsey Map Center
reading_line:
short_title:

description:
  one_line:
  full: "The collections of the David Rumsey Map Center have been shaped by a decade of use and scholarship. As certain materials have resonated with this generation of students, instructors, and researchers, we focus our attention and identify related collections, defining them as distinct clusters within the larger archive. These subsets have in turn defined the David Rumsey Map Center as distinctive, and have set Stanford’s collections apart. As a whole, the collection is vast and not bounded by geography, spanning the 15th century to the present. But within that expanse are specific cohesive areas of strength that have added lasting value to campus and beyond. These clusters emerge through the ways in which we make collections available."

